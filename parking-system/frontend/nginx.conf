# Веб-интерфейс и обратный прокси: браузер обращается к одному адресу,
# nginx направляет /api/* в нужный сервис по префиксу пути
server {
    listen 80;
    root /usr/share/nginx/html;

    # Адреса сервисов определяются через DNS Docker при запросах (а не один раз при старте),
    # поэтому пересоздание контейнера сервиса не приводит к ошибке 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth    http://auth-service:3001;
    set $clients http://clients-service:3002;
    set $parking http://parking-service:3003;

    # Сквозной идентификатор запроса — попадает в журналы сервисов
    proxy_set_header X-Request-Id $request_id;

    location /api/auth/  { proxy_pass $auth; }
    location /api/users  { proxy_pass $auth; }

    location ~ ^/api/clients/\d+/debt$ { proxy_pass $parking; }
    location /api/clients { proxy_pass $clients; }
    location /api/cars    { proxy_pass $clients; }

    location /api/ { proxy_pass $parking; }   # spots, tariffs, sessions, payments

    location / { try_files $uri /index.html; }
}
