log_format with_id '$remote_addr [$time_local] "$request" $status $request_time s id=$request_id';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth    http://auth-service:3001;
    set $clients http://clients-service:3002;
    set $parking http://parking-service:3003;

    # Сквозной идентификатор запроса: тот же ID попадает в журналы всех сервисов
    proxy_set_header X-Request-Id $request_id;
    access_log /var/log/nginx/access.log with_id;

    location /api/auth/          { proxy_pass $auth; }
    location /api/users          { proxy_pass $auth; }

    location ~ ^/api/clients/\d+/debt$ { proxy_pass $parking; }
    location /api/clients        { proxy_pass $clients; }
    location /api/cars           { proxy_pass $clients; }
    location /api/discounts      { proxy_pass $clients; }

    location /api/spots          { proxy_pass $parking; }
    location /api/tariffs        { proxy_pass $parking; }
    location /api/sessions       { proxy_pass $parking; }
    location /api/payments       { proxy_pass $parking; }
    location /api/my/            { proxy_pass $parking; }

    location / { try_files $uri $uri/ /index.html; }
}
